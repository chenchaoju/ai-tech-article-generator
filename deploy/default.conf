server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location = /pc {
        return 301 /pc/;
    }

    location /pc/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /pc/index.html;
    }

    location = /mobile {
        return 301 /mobile/;
    }

    location /mobile/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /mobile/index.html;
    }

    location /api/ {
        proxy_pass http://api:8002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /exception {
        return 301 /exception/;
    }

    location /exception/ {
        proxy_pass http://exception_workflow:5000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }	
    location = /material {
        return 301 /material/;
}
    location /material/ {
        proxy_pass http://special_material_converter:8003/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
       }

    location = /file {
            return 301 /file/;
    }

    location /file/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /file/index.html;
    }
    location /file-api/ {
        proxy_pass http://file_assistant_app:8004/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文章工坊：独立路径，不占用现有 /api/
    location = /article-workshop {
        return 301 /article-workshop/;
    }

    location /article-workshop/api/ {
        proxy_pass http://article_workshop_api:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /article-workshop/ {
        proxy_pass http://article_workshop_web:80/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name ccj.whispery.cn;

    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html/file;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /file-api/ {
        proxy_pass http://file_assistant_app:8004/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
