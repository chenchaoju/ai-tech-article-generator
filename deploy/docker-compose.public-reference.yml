services:
  mysql:
    image: mysql:8.0
    container_name: yun_ledger_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finance_data
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - yun_ledger_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: yun_ledger_api
    restart: always
    environment:
      APP_NAME: 云记账
      ENVIRONMENT: production
      APP_ENV: production
      SECRET_KEY: change-this-secret-key
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/finance_data?charset=utf8mb4
      CORS_ORIGINS: http://117.72.246.88,http:117.72.246.88:80
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yun_ledger_net

  web:
    image: nginx:alpine
    container_name: yun_ledger_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pc_frontend/dist:/usr/share/nginx/html/pc:ro
      - ./mobile_frontend/dist:/usr/share/nginx/html/mobile:ro
    depends_on:
      - api
    networks:
      - yun_ledger_net
  exception_workflow:
    build: /opt/exception_workflow
    container_name: exception_workflow_app
    restart: always
    volumes:
      - /opt/exception_workflow/uploads:/app/uploads
      - /opt/exception_workflow/outputs:/app/outputs
    networks:
      - yun_ledger_net

networks:
  yun_ledger_net:
    driver: bridge

